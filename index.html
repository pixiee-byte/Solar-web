<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">
<link rel="apple-touch-icon" href="icon-192.png">
<script>
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("service-worker.js");
  }
</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Solar</title>
<style>
:root{--bg:#e8e8e8;--ink:#2b2b2b;--btn:#2b2b2b;--btnink:#fff;--mute:#4a4a4a;--cw:min(74vw,400px);color-scheme:light dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0f14;--ink:#f0f0f0;--btn:#f0f0f0;--btnink:#111;--mute:#b4b9c6}}
:root[data-theme="dark"]{--bg:#0d0f14;--ink:#f0f0f0;--btn:#f0f0f0;--btnink:#111;--mute:#b4b9c6}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Roboto,"Helvetica Neue",Arial,sans-serif;overflow-x:hidden}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;position:relative;z-index:3}
header picture,header img{display:block;height:62px;width:auto}
#burger{width:46px;height:46px;border:0;background:none;cursor:pointer;display:grid;place-content:center;gap:7px}
#burger i{display:block;width:30px;height:3px;background:var(--ink);border-radius:2px;transition:transform .3s,opacity .3s}
#burger[aria-expanded=true] i:nth-child(1){transform:translateY(10px) rotate(45deg)}
#burger[aria-expanded=true] i:nth-child(2){opacity:0}
#burger[aria-expanded=true] i:nth-child(3){transform:translateY(-10px) rotate(-45deg)}
#burger:focus-visible,.btn:focus-visible,.dot:focus-visible,#menu a:focus-visible{outline:3px solid #ff8a1f;outline-offset:3px}
#menu{position:absolute;right:20px;top:76px;background:var(--btn);border-radius:16px;padding:8px;display:grid;min-width:190px;opacity:0;transform:translateY(-8px) scale(.96);transform-origin:top right;pointer-events:none;transition:opacity .25s,transform .25s;box-shadow:0 14px 40px rgba(0,0,0,.3)}
#menu.open{opacity:1;transform:none;pointer-events:auto}
#menu a{color:var(--btnink);text-decoration:none;padding:13px 16px;border-radius:10px;font-size:17px}
#menu a:hover{background:rgba(128,128,128,.25)}
.hero{max-width:560px;margin:0 auto;padding:0 24px;text-align:center}
h1{margin:34px 0 0;font-size:clamp(76px,26vw,132px);line-height:1;font-weight:800;letter-spacing:-.03em}
.hero p{margin:34px 0;font-size:18px;line-height:1.45;text-align:left;color:var(--mute)}
.btn{display:inline-block;background:var(--btn);color:var(--btnink);text-decoration:none;font-size:22px;padding:17px 52px;border-radius:16px;transition:transform .2s,box-shadow .2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(0,0,0,.28)}
.btn:active{transform:scale(.96)}
#planets{margin-top:56px;padding-bottom:26px}
#track{display:flex;gap:18px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;position:relative;padding:8px 0 30px;cursor:grab}
#track::-webkit-scrollbar{display:none}
#track::before,#track::after{content:"";flex:0 0 calc(50% - var(--cw)/2 - 18px)}
.slide{flex:0 0 var(--cw);scroll-snap-align:center;--k:1;--glow:#fff}
.name{margin:0 0 14px;text-align:center;font-size:30px;font-weight:700;opacity:calc(1 - var(--k)*.7);transform:translateY(calc(var(--k)*10px)) scale(calc(1 - var(--k)*.12))}
.nm{display:inline-block;position:relative}
.nm::after{content:"";display:block;height:4px;border-radius:2px;margin:6px auto 0;background:var(--glow);width:0;transition:width .6s .25s}
.slide.active .nm{animation:pop .8s cubic-bezier(.2,.9,.25,1.15) both}
.slide.active .nm::after{width:44px}
@keyframes pop{0%{opacity:0;transform:translateY(24px) scale(.86);filter:blur(7px);letter-spacing:.2em}100%{opacity:1;transform:none;filter:none;letter-spacing:0}}
.card{aspect-ratio:1;border-radius:24px;overflow:hidden;background:#05060a;opacity:calc(1 - var(--k)*.5);transform:scale(calc(1 - var(--k)*.14));transition:box-shadow .6s}
.slide.active .card{box-shadow:0 22px 60px -14px var(--glow)}
canvas{display:block;width:100%;height:100%;user-select:none;-webkit-user-drag:none;pointer-events:none}
.slide.active canvas{animation:kb 5s ease-in-out infinite alternate}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.08) rotate(1.2deg)}}
#dots{display:flex;justify-content:center;gap:8px;margin-top:2px}
.dot{width:9px;height:9px;border-radius:5px;border:0;padding:0;background:var(--mute);opacity:.35;cursor:pointer;transition:width .4s,opacity .4s}
.dot.on{width:26px;opacity:1;background:var(--ink)}
.rise{animation:rise .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.slide.active canvas,.rise,.slide.active .nm{animation:none}html{scroll-behavior:auto}}
</style>
</head>

<script>
const rg=(a,b)=>a+Math.random()*(b-a);
function mk(w,h,f){const c=document.createElement('canvas');c.width=w;c.height=h;f(c.getContext('2d'),w,h);return c}
function pick(cols,v){v=Math.max(0,Math.min(.999,v));const i=v*(cols.length-1),a=Math.floor(i),f=i-a,p=cols[a],q=cols[a+1];return`rgb(${p.map((n,k)=>Math.round(n+(q[k]-n)*f)).join(',')})`}
function bands(cols,fq,jit,spot){return mk(512,256,(x,w,h)=>{
  for(let y=0;y<h;y++){const v=(Math.sin(y*.07*fq)+Math.sin(y*.19*fq+1.3)*.6+Math.sin(y*.41*fq)*.3)/1.9*.5+.5+rg(-jit,jit);x.fillStyle=pick(cols,v);x.fillRect(0,y,w,1)}
  for(let i=0;i<70;i++){x.fillStyle=i%2?'rgba(255,255,255,.05)':'rgba(0,0,0,.05)';x.beginPath();x.ellipse(rg(0,w),rg(0,h),rg(20,90),rg(2,7),0,0,6.3);x.fill()}
  if(spot){x.shadowBlur=14;x.shadowColor='#b4472b';x.fillStyle='rgba(190,80,50,.85)';x.beginPath();x.ellipse(350,172,30,16,0,0,6.3);x.fill()}})}
function craters(base,dark,light,n,cap){return mk(512,256,(x,w,h)=>{
  x.fillStyle=base;x.fillRect(0,0,w,h);
  for(let i=0;i<60;i++){x.fillStyle=Math.random()<.5?dark:light;x.globalAlpha=.18;x.beginPath();x.arc(rg(0,w),rg(0,h),rg(8,40),0,6.3);x.fill()}
  for(let i=0;i<n;i++){const cx=rg(0,w),cy=rg(0,h),r=rg(2,12);x.globalAlpha=.5;x.fillStyle=dark;x.beginPath();x.arc(cx,cy,r,0,6.3);x.fill();x.globalAlpha=.4;x.strokeStyle=light;x.beginPath();x.arc(cx-1,cy-1,r,0,6.3);x.stroke()}
  x.globalAlpha=1;if(cap){x.fillStyle='rgba(255,255,255,.85)';x.fillRect(0,0,w,10);x.fillRect(0,h-10,w,10)}})}
const earth=()=>mk(512,256,(x,w,h)=>{
  x.fillStyle='#14508f';x.fillRect(0,0,w,h);
  for(let i=0;i<16;i++){const cx=rg(30,w-30),cy=rg(50,h-50),t=Math.random()<.3;for(let j=0;j<45;j++){x.fillStyle=t?`rgb(${rg(150,190)},${rg(130,160)},${rg(80,110)})`:`rgb(${rg(40,80)},${rg(110,150)},${rg(50,70)})`;x.beginPath();x.arc(cx+rg(-45,45),cy+rg(-22,22),rg(7,20),0,6.3);x.fill()}}
  x.fillStyle='#fff';x.fillRect(0,0,w,14);x.fillRect(0,h-14,w,14);
  for(let i=0;i<90;i++){x.fillStyle='rgba(255,255,255,.4)';x.beginPath();x.ellipse(rg(0,w),rg(10,h-10),rg(15,50),rg(4,10),0,0,6.3);x.fill()}});
const sunTex=()=>mk(512,256,(x,w,h)=>{x.fillStyle='#ff9a1f';x.fillRect(0,0,w,h);for(let i=0;i<900;i++){x.fillStyle=Math.random()<.5?'rgba(255,226,122,.16)':'rgba(190,60,5,.16)';x.beginPath();x.arc(rg(0,w),rg(0,h),rg(3,26),0,6.3);x.fill()}});

const P=[
{n:"Sun",tx:sunTex,r:185,sun:1,glow:"#ff8a1f",rot:0},
{n:"Mercury",tx:()=>craters('#8f8a82','#4a463f','#c9c3ba',140),r:120,glow:"#b9b2a8",rot:1},
{n:"Venus",tx:()=>bands([[230,190,110],[200,140,70],[245,215,150]],1.6,.25),r:165,glow:"#f0c070",rim:[255,200,120],rot:0},
{n:"Earth",tx:earth,r:170,glow:"#4aa3ff",rim:[90,160,255],rot:2.2},
{n:"Mars",tx:()=>craters('#b5532f','#6e2a15','#e08a63',90,true),r:135,glow:"#e0683e",rot:0},
{n:"Jupiter",tx:()=>bands([[236,210,170],[196,140,95],[240,225,190],[160,100,70]],1.2,.12,true),r:205,glow:"#e0b080",rot:.2},
{n:"Saturn",tx:()=>bands([[240,222,170],[205,180,125],[245,232,190]],.9,.06),r:108,ring:1,glow:"#e8d29a",rot:0},
{n:"Uranus",tx:()=>bands([[150,225,230],[120,200,215]],.5,.03),r:165,glow:"#7fe0ea",rim:[140,230,240],rot:0},
{n:"Neptune",tx:()=>bands([[70,100,230],[40,60,170],[90,120,240]],.8,.05),r:160,glow:"#4a6cf0",rim:[90,120,255],rot:0}
];

function sphere(p){
  const r=p.r,n=2*r+2,t=p.tx(),tw=t.width,th=t.height,td=t.getContext('2d').getImageData(0,0,tw,th).data;
  const cv=document.createElement('canvas');cv.width=cv.height=n;
  const cx=cv.getContext('2d'),im=cx.createImageData(n,n),d=im.data,rim=p.rim;
  for(let y=0;y<n;y++)for(let x=0;x<n;x++){
    const nx=(x-r-.5)/r,ny=(y-r-.5)/r,q=nx*nx+ny*ny;if(q>1.01)continue;
    const nz=Math.sqrt(Math.max(0,1-q)),lon=Math.atan2(nx,nz)+p.rot,u=((lon/6.2832+.5)%1+1)%1,v=.5+Math.asin(Math.max(-1,Math.min(1,ny)))/Math.PI;
    const i=(Math.min(th-1,v*th|0)*tw+(u*tw|0))*4;
    const L=p.sun?.55+.6*Math.sqrt(nz):.06+.98*Math.pow(Math.max(0,-.55*nx-.45*ny+.7*nz),.85);
    const e=rim?Math.pow(1-nz,3)*.8*Math.max(0,L+.1):0,o=(y*n+x)*4;
    for(let k=0;k<3;k++)d[o+k]=Math.min(255,td[i+k]*L+(rim?rim[k]*e:0));
    d[o+3]=q>1?255*(1.01-q)/.01:255;
  }
  cx.putImageData(im,0,0);return cv;
}
function ring(x,c,r,f){x.save();x.translate(c,c);x.rotate(-.32);x.scale(1,.3);
  for(let k=1.35;k<2.3;k+=.015){const a=k<1.6?.4:k<1.95?.8:k<2.02?.08:.62,s=Math.sin(k*50)*18;x.strokeStyle=`rgba(${215+s|0},${195+s|0},150,${a})`;x.lineWidth=r*.022;x.beginPath();x.arc(0,0,k*r,f?0:Math.PI,f?Math.PI:6.2832);x.stroke()}
  x.restore()}
function paint(cv,p){
  const S=cv.width,c=S/2,r=p.r,x=cv.getContext('2d');
  x.fillStyle='#05060a';x.fillRect(0,0,S,S);
  for(let i=0;i<70;i++){x.fillStyle=`rgba(255,255,255,${rg(.2,.8)})`;x.beginPath();x.arc(rg(0,S),rg(0,S),rg(.4,1.4),0,6.3);x.fill()}
  const g=x.createRadialGradient(c,c,r*.7,c,c,r*(p.sun?1.5:1.7));g.addColorStop(0,p.glow+(p.sun?'cc':'66'));g.addColorStop(1,p.glow+'00');x.fillStyle=g;x.fillRect(0,0,S,S);
  if(p.ring)ring(x,c,r,0);
  x.drawImage(sphere(p),c-r-1,c-r-1);
  if(p.ring)ring(x,c,r,1);
}

const track=document.getElementById('track'),dots=document.getElementById('dots');
const slides=P.map((p,i)=>{
  const s=document.createElement('div');s.className='slide';s.style.setProperty('--glow',p.glow);
  s.innerHTML=`<h3 class="name"><span class="nm">${p.n}</span></h3><div class="card"><canvas width="520" height="520" role="img" aria-label="${p.n}"></canvas></div>`;
  track.appendChild(s);
  const b=document.createElement('button');b.className='dot';b.setAttribute('aria-label','Show '+p.n);b.onclick=()=>go(i);dots.appendChild(b);
  return s;
});
let k=0;(function next(){if(k<P.length){paint(slides[k].querySelector('canvas'),P[k]);k++;setTimeout(next,0)}})();

let cur=-1,prog=0,last=performance.now(),holding=false,raf=0;
function update(){
  raf=0;const mid=track.scrollLeft+track.clientWidth/2;let best=0,bd=1e9;
  slides.forEach((s,i)=>{const d=Math.abs(s.offsetLeft+s.offsetWidth/2-mid);if(d<bd){bd=d;best=i}s.style.setProperty('--k',Math.min(1,d/(s.offsetWidth+18)).toFixed(3))});
  if(best!==cur){cur=best;slides.forEach((s,i)=>s.classList.toggle('active',i===best));[...dots.children].forEach((d,i)=>d.classList.toggle('on',i===best))}
}
function go(i){const s=slides[i];prog=performance.now()+1300;last=performance.now();track.scrollTo({left:s.offsetLeft+s.offsetWidth/2-track.clientWidth/2,behavior:'smooth'})}
track.addEventListener('scroll',()=>{if(performance.now()>prog)last=performance.now();if(!raf)raf=requestAnimationFrame(update)},{passive:true});
addEventListener('resize',update);update();
setInterval(()=>{if(!holding&&performance.now()-last>=2000)go((cur+1)%P.length)},250);

let dragX=null,startL=0;
track.addEventListener('pointerdown',e=>{holding=true;last=performance.now();if(e.pointerType==='mouse'){dragX=e.clientX;startL=track.scrollLeft;track.style.scrollSnapType='none';track.setPointerCapture(e.pointerId)}});
track.addEventListener('pointermove',e=>{if(dragX!==null)track.scrollLeft=startL-(e.clientX-dragX)});
function release(){holding=false;last=performance.now();if(dragX!==null){dragX=null;track.style.scrollSnapType='';go(cur)}}
track.addEventListener('pointerup',release);track.addEventListener('pointercancel',release);
track.addEventListener('wheel',()=>{last=performance.now()},{passive:true});

const burger=document.getElementById('burger'),menu=document.getElementById('menu');
function setMenu(o){menu.classList.toggle('open',o);burger.setAttribute('aria-expanded',o);burger.setAttribute('aria-label',o?'Close menu':'Open menu')}
burger.onclick=()=>setMenu(!menu.classList.contains('open'));
menu.addEventListener('click',e=>{if(e.target.closest('a'))setMenu(false)});
addEventListener('keydown',e=>{if(e.key==='Escape')setMenu(false)});
</script>
</body>
